spring:
  jpa:
    database: H2
    properties:
      dialect: org.hibernate.dialect.H2Dialect
      hibernate.format_sql: true
      hibernate.generate_statistics: true
    hibernate:
      #to turn off schema validation that fails (because of clob types) and blocks tests even if the schema is compatible
      ddl-auto: none

logging:
  level:
    org.springframework.orm.jpa: INFO
    org.springframework.transaction: INFO
    org.hibernate.SQL: INFO
    org.hibernate.orm.jdbc.bind: INFO

powsybl-ws:
  database:
    vendor: h2:mem
    query: ;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    hostPort: ":"

useradmin:
  defaultMaxAllowedCases: 20
  defaultMaxAllowedBuilds: 10
  defaultMaxAllowedLoadflow: 2
  defaultMaxAllowedSecurity: 2
  defaultMaxAllowedSensitivity: 1
  defaultMaxAllowedShortCircuit: 1
  defaultMaxAllowedVoltageInit: 2
  defaultMaxAllowedPccMin: 1
  defaultMaxAllowedStateEstimation: 1
  defaultMaxAllowedBalanceAdjustement: 1
  defaultMaxAllowedDynamicSimulation: 1
  defaultMaxAllowedDynamicSecurity: 1
  defaultMaxAllowedDynamicMargin: 1
